name: Native integration validation
on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/integration-*.ts'
      - 'supabase/functions/oauth-*/**'
      - 'supabase/functions/gsc-insights/**'
      - 'scripts/native-integrations.test.mjs'
      - 'scripts/integration-*.test.mjs'
      - 'supabase/functions/automation-runner/**'
      - 'supabase/functions/daily-digest/**'
      - 'supabase/functions/figma-info/**'
      - 'supabase/functions/incident-notify/**'
      - 'supabase/functions/push-send/**'
      - 'supabase/functions/vercel-watch/**'
      - 'supabase/functions/webhook-dispatch/**'
      - 'supabase/functions/webhook-retry-worker/**'
      - 'supabase/functions/weekly-intel-report/**'
      - 'supabase/functions/whatsapp-send/**'
      - 'supabase/functions/whatsapp-webhook/**'
      - '.github/workflows/native-integrations-test.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/integration-*.ts'
      - 'supabase/functions/oauth-*/**'
      - 'supabase/functions/gsc-insights/**'
      - 'scripts/native-integrations.test.mjs'
      - 'scripts/integration-*.test.mjs'
      - 'supabase/functions/automation-runner/**'
      - 'supabase/functions/daily-digest/**'
      - 'supabase/functions/figma-info/**'
      - 'supabase/functions/incident-notify/**'
      - 'supabase/functions/push-send/**'
      - 'supabase/functions/vercel-watch/**'
      - 'supabase/functions/webhook-dispatch/**'
      - 'supabase/functions/webhook-retry-worker/**'
      - 'supabase/functions/weekly-intel-report/**'
      - 'supabase/functions/whatsapp-send/**'
      - 'supabase/functions/whatsapp-webhook/**'
      - '.github/workflows/native-integrations-test.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.2.8
      - run: deno check --no-config --node-modules-dir=none supabase/functions/oauth-start/index.ts supabase/functions/oauth-callback/index.ts supabase/functions/gsc-insights/index.ts supabase/functions/automation-runner/index.ts supabase/functions/daily-digest/index.ts supabase/functions/figma-info/index.ts supabase/functions/incident-notify/index.ts supabase/functions/push-send/index.ts supabase/functions/vercel-watch/index.ts supabase/functions/webhook-dispatch/index.ts supabase/functions/webhook-retry-worker/index.ts supabase/functions/weekly-intel-report/index.ts supabase/functions/whatsapp-send/index.ts supabase/functions/whatsapp-webhook/index.ts
      - run: npm ci --ignore-scripts
      - run: node --test scripts/native-integrations.test.mjs scripts/integration-runtime.test.mjs scripts/integration-transport.test.mjs
