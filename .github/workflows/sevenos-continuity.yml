name: SevenOS session and editing continuity
on:
  pull_request:
    paths: ['src/**', 'scripts/editor-*', 'scripts/auth-session-regression.test.mjs', 'scripts/offline-queue-read.test.mjs', 'scripts/proposals.test.mjs', 'scripts/stage-workspaces.test.mjs', 'scripts/notifications.test.mjs', 'scripts/pwa-update-activation.test.mjs', 'scripts/integration-runtime.test.mjs', 'supabase/functions/push-*/**', 'supabase/functions/_shared/push-*', 'supabase/migrations/**', 'scripts/public-performance.test.mjs', 'scripts/public-first-paint.ts', 'scripts/lucide-icon-assets.ts', 'scripts/mobile-lucide-assets.test.mjs', 'scripts/hero-hydration.test.mjs', 'scripts/public-route-fallback.test.mjs', 'scripts/public-bootstrap.test.mjs', 'public/registerSW.js', 'scripts/public-process-boundary.test.mjs', 'vite.config.ts', 'scripts/permission-boundaries.test.mjs', 'package*.json', '.github/workflows/sevenos-continuity.yml']
  push:
    branches: [main]
    paths: ['src/**', 'scripts/editor-*', 'scripts/auth-session-regression.test.mjs', 'scripts/offline-queue-read.test.mjs', 'scripts/proposals.test.mjs', 'scripts/stage-workspaces.test.mjs', 'scripts/notifications.test.mjs', 'scripts/pwa-update-activation.test.mjs', 'scripts/integration-runtime.test.mjs', 'supabase/functions/push-*/**', 'supabase/functions/_shared/push-*', 'supabase/migrations/**', 'scripts/public-performance.test.mjs', 'scripts/public-first-paint.ts', 'scripts/lucide-icon-assets.ts', 'scripts/mobile-lucide-assets.test.mjs', 'scripts/hero-hydration.test.mjs', 'scripts/public-route-fallback.test.mjs', 'scripts/public-bootstrap.test.mjs', 'public/registerSW.js', 'scripts/public-process-boundary.test.mjs', 'vite.config.ts', 'scripts/permission-boundaries.test.mjs', 'package*.json', '.github/workflows/sevenos-continuity.yml']
permissions:
  contents: read
jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node --test scripts/auth-session-regression.test.mjs scripts/editor-continuity.test.mjs scripts/editor-save-conflicts.test.mjs scripts/native-mfa.test.mjs scripts/auth-redirect-safety.test.mjs scripts/offline-queue-read.test.mjs scripts/proposals.test.mjs scripts/stage-workspaces.test.mjs scripts/notifications.test.mjs scripts/pwa-update-activation.test.mjs scripts/integration-runtime.test.mjs scripts/permission-boundaries.test.mjs scripts/public-i18n.test.mjs scripts/editorial-i18n.test.mjs scripts/public-content.test.mjs
      - run: npm run build
      - run: node --test scripts/public-performance.test.mjs scripts/hero-hydration.test.mjs scripts/public-process-boundary.test.mjs scripts/mobile-lucide-assets.test.mjs scripts/public-route-fallback.test.mjs scripts/public-bootstrap.test.mjs scripts/public-spatial.test.mjs scripts/experience-scroll.test.mjs scripts/store-scope.test.mjs
