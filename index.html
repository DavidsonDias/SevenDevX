<html lang="pt-BR" dir="ltr">
  <head>
    <!-- ═════════════════════════════════════════════════════════
         📡 1. METADADOS ESSENCIAIS
         ═════════════════════════════════════════════════════════ -->
    
    <!-- Charset deve ser o PRIMEIRO meta tag -->
    <meta charset="UTF-8" />
    
    <!-- Viewport otimizado para mobile + PWA -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    
    <!-- Language hints -->
    <meta http-equiv="Content-Language" content="pt-BR" />
    
    <!-- Color scheme (dark mode aware) -->
    <meta name="color-scheme" content="dark light" />
    
    <!-- Theme color (barra de endereço mobile) -->
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    
    <!-- Format detection (iOS Safari) -->
    <meta name="format-detection" content="telephone=no" />
    
    <!-- ═════════════════════════════════════════════════════════
         🍎 2. iOS WebApp OTIMIZAÇÕES
         ═════════════════════════════════════════════════════════ -->
    
    <!-- WebApp capable (fullscreen em iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    
    <!-- Status bar style (iOS) -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    
    <!-- WebApp title (quando adicionado à home screen) -->
    <meta name="apple-mobile-web-app-title" content="SevenDevX" />
    
    <!-- ═════════════════════════════════════════════════════════
         🧠 3. SEO FALLBACK (substituído por SEOHead.tsx em runtime)
         ═════════════════════════════════════════════════════════ -->
    
    <title>SevenDevX | Desenvolvimento Web & Soluções Tecnológicas de Alto Nível</title>
    
    <meta
      name="description"
      content="SevenDevX oferece desenvolvimento web moderno, criação de sites, softwares personalizados, manutenção de TI e soluções digitais inovadoras em Belo Horizonte."
    />
    
    <meta
      name="keywords"
      content="SevenDevX, desenvolvimento web, criação de sites, Belo Horizonte, software personalizado, manutenção TI, tecnologia, React, TypeScript, Tailwind, PWA"
    />
    
    <meta name="author" content="SevenDevX Development Team" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="googlebot" content="index, follow" />
    
    <!-- Canonical URL (evita duplicate content) -->
    <link rel="canonical" href="https://www.sevendevx.com/" />
    
    <!-- ═════════════════════════════════════════════════════════
         🧭 4. OPEN GRAPH (Facebook, LinkedIn, WhatsApp)
         ═════════════════════════════════════════════════════════ -->
    
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="SevenDevX" />
    <meta property="og:url" content="https://sevendevx.com/" />
    <meta property="og:title" content="SevenDevX | Desenvolvimento Web & Tecnologia" />
    <meta
      property="og:description"
      content="Soluções web modernas, rápidas e escaláveis. Desenvolvimento profissional para empresas que valorizam qualidade."
    />
    <meta property="og:image" content="https://sevendevx.com/assets/img/share.png" />
    <meta property="og:image:alt" content="Banner SevenDevX - Desenvolvimento Web Premium" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    
    <!-- ═════════════════════════════════════════════════════════
         🐦 5. TWITTER / X CARDS
         ═════════════════════════════════════════════════════════ -->
    
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@sevendevx" />
    <meta name="twitter:creator" content="@sevendevx" />
    <meta name="twitter:title" content="SevenDevX | Desenvolvimento Web Premium" />
    <meta
      name="twitter:description"
      content="Desenvolvimento web moderno com React, TypeScript e PWA. Soluções escaláveis e performáticas."
    />
    <meta name="twitter:image" content="https://sevendevx.com/assets/img/share.png" />
    
    <!-- ═════════════════════════════════════════════════════════
         🏢 6. SCHEMA.ORG STRUCTURED DATA (JSON-LD)
         ═════════════════════════════════════════════════════════ -->
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SevenDevX",
      "alternateName": "SevenDevX Tech",
      "url": "https://sevendevx.com",
      "logo": "https://sevendevx.com/logo-512.png",
      "description": "Empresa de desenvolvimento web especializada em soluções modernas, escaláveis e de alta performance.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Belo Horizonte",
        "addressRegion": "MG",
        "addressCountry": "BR"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+55-31-98474-0625",
        "contactType": "Customer Service",
        "areaServed": "BR",
        "availableLanguage": "pt-BR"
      },
      "sameAs": [
        "https://github.com/sevendevx",
        "https://linkedin.com/company/sevendevx"
      ]
    }
    </script>
    
    <!-- ═════════════════════════════════════════════════════════
         🪩 7. FAVICONS & PWA ICONS (Multi-platform)
         ═════════════════════════════════════════════════════════ -->
    
    <!-- Standard favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    
    <!-- Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Safari pinned tab icon (macOS) -->
    <link rel="mask-icon" href="/maskable-icon-512.png" color="#000000" />
    
    <!-- Android Chrome (PWA) -->
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo-512.png" />
    
    <!-- ═════════════════════════════════════════════════════════
         📱 8. PWA MANIFEST
         ═════════════════════════════════════════════════════════ -->
    
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    
    <!-- ═════════════════════════════════════════════════════════
         🌙 9. iOS SPLASH SCREENS (Apple devices)
         ═════════════════════════════════════════════════════════ -->
    
    <!-- iPhone 14 Pro -->
    <link
      rel="apple-touch-startup-image"
      href="/splashscreens/iphone14pro_splash.png"
      media="(device-width: 393px) and (device-height: 852px)
        and (-webkit-device-pixel-ratio: 3)
        and (orientation: portrait)"
    />
    
    <!-- iPhone 14 Pro Max -->
    <link
      rel="apple-touch-startup-image"
      href="/splashscreens/iphone14promax_splash.png"
      media="(device-width: 430px) and (device-height: 932px)
        and (-webkit-device-pixel-ratio: 3)
        and (orientation: portrait)"
    />
    
    <!-- iPad Pro 12.9" -->
    <link
      rel="apple-touch-startup-image"
      href="/splashscreens/ipadpro12_splash.png"
      media="(device-width: 1024px) and (device-height: 1366px)
        and (-webkit-device-pixel-ratio: 2)
        and (orientation: portrait)"
    />
    
    <!-- ═════════════════════════════════════════════════════════
         🚀 10. PERFORMANCE OPTIMIZATIONS
         ═════════════════════════════════════════════════════════ -->
    
    <!-- Preconnect (establish early connections) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://phdmdnopdlfywymptimy.supabase.co" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    
    <!-- DNS Prefetch (fallback for older browsers) -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    
    <!-- Font Preload (critical fonts for LCP) -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" as="style" />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" as="style" />
    
    <!-- hreflang (multilingual SEO) -->
    <link rel="alternate" hreflang="pt-BR" href="https://www.sevendevx.com/" />
    <link rel="alternate" hreflang="en" href="https://www.sevendevx.com/" />
    <link rel="alternate" hreflang="es" href="https://www.sevendevx.com/" />
    <link rel="alternate" hreflang="x-default" href="https://www.sevendevx.com/" />
    
    <!-- ═════════════════════════════════════════════════════════
         🔒 11. CONTENT SECURITY POLICY (CSP)
         ═════════════════════════════════════════════════════════ -->
    
    <!--
      CSP otimizado para produção:
      • script-src: 'self' + 'unsafe-inline' (Vite HMR) + 'unsafe-eval' (dev only)
      • style-src: 'self' + 'unsafe-inline' (Tailwind) + Google Fonts
      • img-src: 'self' +  + https: (permite todas HTTPS imgs)
      • font-src: 'self' + Google Fonts
      • connect-src: 'self' + WhatsApp API
      
      PRODUÇÃO: Remover 'unsafe-eval' e usar nonce para scripts
    -->
    <!--
      CSP é definido via header HTTP no vercel.json (fonte única de verdade).
      Mantemos este comentário para histórico — NÃO declarar CSP por <meta>
      aqui para evitar interseção restritiva em iOS Safari/Firefox.
    -->
    
    <!-- ═════════════════════════════════════════════════════════
         🧩 12. BUILD INFO & GENERATOR
         ═════════════════════════════════════════════════════════ -->
    
    <meta
      name="generator"
      content="Vite 5+ • React 18+ • TypeScript 5+ • Tailwind CSS 3+ • Framer Motion • GSAP"
    />
    
    <!-- Referrer Policy (privacidade) -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>

  <body class="bg-black text-white antialiased overflow-x-hidden" data-theme="dark">
    <!-- ═════════════════════════════════════════════════════════
         🎯 ROOT ELEMENT (React monta aqui)
         ═════════════════════════════════════════════════════════ -->
    
    <div id="root"></div>

    <!-- ═════════════════════════════════════════════════════════
         🌍 VARIÁVEIS GLOBAIS (configuráveis)
         ═════════════════════════════════════════════════════════ -->
    
    <script>
      // URLs base para API e assets (facilita mudança de ambiente)
      window.contentBaseUrl = "https://sevendevx.com/data";
      window.assetsBaseUrl = "https://sevendevx.com/assets";
      
      // Feature flags (opcional)
      window.appConfig = {
        version: "4.0.0",
        environment: "production",
        enableAnalytics: true,
        enableServiceWorker: true
      };
    </script>

    <!-- ═════════════════════════════════════════════════════════
         ⚙️ SCRIPT PRINCIPAL (module = defer automático)
         ═════════════════════════════════════════════════════════ -->
    
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Fallback para browsers sem module support (legacy) -->
    <script nomodule>
      document.body.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;font-family:sans-serif;padding:2rem;">
          <div>
            <h1 style="font-size:2rem;margin-bottom:1rem;">⚠️ Navegador Incompatível</h1>
            <p style="color:#666;">
              Seu navegador não suporta esta aplicação moderna.<br>
              Por favor, atualize para a versão mais recente do <strong>Chrome</strong>, <strong>Firefox</strong>, <strong>Safari</strong> ou <strong>Edge</strong>.
            </p>
          </div>
        </div>
      `;
    </script>
  </body>
</html>
